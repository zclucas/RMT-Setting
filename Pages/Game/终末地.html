<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>终末地</title>
  <link rel="icon" href="../../Images/Icon.png" />
  <link rel="stylesheet" href="../../CSS/Info.css" />
</head>

<body>
  <header>
    <h1>终末地</h1>
  </header>

  <main class="info-container">
    <!-- 左侧列表 -->
    <div id="infoList" class="info-list"></div>

    <!-- 右侧详细信息 -->
    <div id="infoDetail" class="info-detail">
      <p class="placeholder">点击左侧条目查看详细内容</p>
    </div>
  </main>

  <script>document.addEventListener("DOMContentLoaded", () => {
      const infoList = document.getElementById("infoList");
      const infoDetail = document.getElementById("infoDetail");

      const datas = [
        {
          id: "auto-work",
          title: "42伊冯飞天",
          author: "uvycriss",
          feature: "终末地42伊冯飞天",
          steps: [
            "起跳后长按z键，42伊冯在1,2号位即可",
          ],
          file: "../../游戏宏/终末地/42伊冯飞天/终末地.rmt",
        },
        {
          id: "一键日常",
          title: "一键日常",
          author: "ytt",
          feature: "一键精锻、自动奔跑、连点采集、自动刷基质（刷狗粮用）",
          steps: [
            "一键精锻：进入精锻的选择狗粮界面，使用此宏即可一键精锻一次",
            "自动奔跑",
            "f键连点，大世界采集物品可用",
            "自动刷基质（刷狗粮用）",
            "注意事项：",
            "分辨率为2560*1440_全屏，不确定其他分辨率是否能正常运转",
            "如过不方便给连点F设置一个额外宏键，可使用下面的双击f自动连点F，再次点击f即可暂停连点。",
            "由于mma的自动刷基质效率又低又蠢因此制作了这个刷基质宏，此宏不会战斗只会领取奖励和释放连携技，不使用刻写券，刷到体力刷干为止，推荐主控昼雪或余烬（耐打）；需要先把自己用管道桥卡住，保证无论怎么移动都能点到交互点，所以只支持武陵和清波宅，卡住的教程请看图片备注；管道桥摆放完毕后无法进入中间，可配合我的【一键隐藏工业设备】，隐藏后进入点位再按esc恢复工业设备。",
            "tips：如果不知道mma是什么请b站搜终末地mma。"
          ],
          file: "../../游戏宏/终末地/一键日常/终末地实用功能集合.rmt",
          images: [
            { name: "备注1", src: "../../游戏宏/终末地/一键日常/Pic1.png" },
            { name: "备注2", src: "../../游戏宏/终末地/一键日常/Pic2.png" },
          ]
        },
        {
          id: "自动搬运",
          title: "自动搬谷地源石粉末到武陵",
          author: "天香魂",
          feature: "自动搬运源石粉末到武陵生产电池",
          steps: [
            "按键触发，识图进行下一步",
          ],
          file: "../../游戏宏/终末地/自动搬运/终末地自动搬谷地源石粉末到武陵.rmt",
        },
      ];

      // 渲染左侧列表
      datas.forEach((item, index) => {
        const btn = document.createElement("div");
        btn.className = "info-button" + (index === 0 ? " active" : "");
        btn.textContent = item.title;
        btn.dataset.id = item.id;
        infoList.appendChild(btn);
      });

      // 默认显示第一个条目
      renderInfo(datas[0]);

      // 点击切换条目
      infoList.addEventListener("click", (e) => {
        const target = e.target.closest(".info-button");
        if (!target) return;

        document.querySelectorAll(".info-button").forEach(b => b.classList.remove("active"));
        target.classList.add("active");

        const data = datas.find(c => c.id === target.dataset.id);
        renderInfo(data);
      });

      document.body.addEventListener("click", e => {
        const img = e.target.closest(".image-item img");
        if (!img) return;

        const overlay = Object.assign(document.createElement("div"), {
          className: "img-overlay",
          innerHTML: `<img src="${img.src}" alt="">`
        });

        document.body.appendChild(overlay);
        overlay.addEventListener("click", () => overlay.remove());
      });

      function renderInfo(data) {
        let imagesHTML = "";
        if (data.images && data.images.length > 0) {
          imagesHTML = `<div class="images">
                ${data.images.map(img => `
                    <div class="image-item">
                        <p>${img.name}</p>
                        <img src="${img.src}" alt="${img.name}" />
                    </div>
                `).join("")}
            </div>`;
        }

        infoDetail.innerHTML = `
            <h2>${data.title}</h2>
            <div class="info">
                <p><strong>作者：</strong>${data.author}</p>
                <p><strong>功能描述：</strong>${data.feature}</p>
            </div>
            <div class="steps">
                <p><strong>操作步骤：</strong></p>
                <ol>${data.steps.map(s => `<li>${s}</li>`).join("")}</ol>
            </div>
            ${imagesHTML}
            <a class="download-btn" href="${data.file}" download>⬇下载配置</a>
        `;
      }
    });
  </script>
</body>

</html>
