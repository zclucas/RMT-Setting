<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>洛克王国世界</title>
  <link rel="icon" href="../../Images/Icon.png" />
  <link rel="stylesheet" href="../../CSS/Info.css" />
</head>

<body>
  <header>
    <h1>洛克王国世界</h1>
  </header>

  <main class="info-container">
    <!-- 左侧列表 -->
    <div id="infoList" class="info-list"></div>

    <!-- 右侧详细信息 -->
    <div id="infoDetail" class="info-detail">
      <p class="placeholder">点击左侧条目查看详细内容</p>
    </div>
  </main>

  <script>document.addEventListener("DOMContentLoaded", () => {
      const infoList = document.getElementById("infoList");
      const infoDetail = document.getElementById("infoDetail");

      const datas = [
        {
          id: "快捷键-自动剧情-操作简化",
          title: "快捷键-自动剧情-操作简化",
          author: "Nimoll",
          feature: "为游戏洛克王国世界添加没有的快捷按键，鼠标滚轮选择宠物，ad按键切换队伍，空格确定传送，自动过剧情，自动战斗，持续扔咕噜球，自动脱离战斗，局内扔球直至捕捉，开背包里的技能配方，自动打污染，点击精灵进化",
          steps: [
            "注：5月9日洛克版本更新后用不了的进游戏内设置选择数据修复，再重启游戏即可",
            "适配2.5k，即2560*1600分辨率",
            "切换队伍功能需要在按p后出现的小队页面使用，需要把识别的文字改为你的小队名字的第一个字，默认为大世界小队中的”大“字",
            "按下右alt触发菜单宏（需先开关背包给鼠标复位避免在鼠标自动回正时误触发）",
            "可在菜单宏开启自动过剧情功能",
            "自动战斗功能，支持迪莫在无克制时放折射和燃薪虫重复点燃和充分燃烧，打圣剑骑士会引燃然后充分燃烧两次秒杀，其他角色优先释放克制技能，若无则释放一号技能，能量在3以下会自动使用能量瓶恢复，可以打花种但无法识别宠物",
            "持续捕捉为在选择咕噜球时连续点击鼠标左键",
            "开技能石需要在背包-重要页面启动，解锁背包里所有技能后自动停止",
            "打污染功能会在触发非污染精灵战斗时避战，与污染精灵自动战斗后触发局内扔球功能，出异色会暂停，需要手动进行捕捉",
            "局内扔球：有普通球扔普通球，没有则扔高级球，碰到陨星虫则扔绝缘球"
          ],
          file: "../../游戏宏/洛克王国世界/快捷键-自动剧情-操作简化/洛克王国世界.rmt",
        },
        {
          id: "挂机刷花",
          title: "挂机刷花",
          author: "rubi",
          feature: "洛克王国简单挂机刷花",
          steps: [
            "需电脑多开洛克王国世界游戏窗口。",
            "并在做动作的账号游戏窗口内，按tab按键打开人物动作UI",
            "以管理员身份启动若梦兔程序，加载配置包",
            "加载完配置后，点击（2.）的游戏窗口。按ctrl+shitf+\ 组合按键启动。?首次启动声音响起证明启动成功",
          ],
          file: "../../游戏宏/洛克王国世界/挂机刷花/后台挂机刷花.rmt",
        },
        {
          id: "便携挖矿",
          title: "便携挖矿",
          author: "ling",
          feature: "右键放出宠物挖矿，侧键换乘背包同乘宠物",
          steps: [
            "挖矿功能：",
            "启用前请先启用变量定义初始化宏",
            "本宏默认1号栏位骑乘，2号栏位视野精灵  如有其他需要自行修改变量宏，但其他配置均未测试。",
            "对准矿物后右键即可扔出宠物挖矿，并且自动回到视野精灵栏位2",
            "切换同乘功能",
            "鼠标侧键启动，如果启动不了请设置其他启动键",
            "操作过程请不要移动",
            "如果有操作未生效情况请将间隔调大"
          ],
          file: "../../游戏宏/洛克王国世界/挖矿/洛克王国便捷挖矿2.0.rmt",
        },
        {
          id: "sen",
          title: "挖矿-切精灵-切同乘-逃跑+牵手",
          author: "sen",
          feature: "洛克王国挖矿：1.切精灵；2.切队伍同乘；3逃跑+牵手",
          steps: [
            "alt+tab作为为开关，按了才能使用1和2的功能。（案例里的功能切换）",
            "切精灵：鼠标左键松开触发，扔完精灵后，自动切换下一位精灵。123456号位精灵轮换。",
            "换队伍同乘：3队为全爱，2队的的4号位为同乘。按r触发，先切换到2队，上同乘，再切回去3队爱分享。",
            "逃跑+牵手：进战斗自动逃跑。自动同意别人发起的“带带”",
          ],
          file: "../../游戏宏/洛克王国世界/挖矿-切精灵-切同乘-逃跑+牵手/洛克王国.rmt",
        },
        {
          id: "张水中",
          title: "自用宏",
          author: "张水中",
          feature: "《洛克王国：世界》的自用宏",
          steps: [
            "自动挂花：需要3-4个号，其中需要操作的号（小号）放在ALT+TAB能进行切换的第一个和第二个位置；第一个位置为房主，并且要靠近“魔力之源”；第二个位置为“大笑”号（如果只有鞠躬需要把相应的3键改成2键，间隔改成15秒）；白天进行每20分钟一次循环切换成白天；“4人23草6爱”效率为1425.2/h--1525.5/h。",
            "取消丢球后摇：需要有精灵视野的精灵",
            "在天空中持续W：字面意思，记得关",
            "自己带小号打怪：其中需要操作的号（一个小号一个大号）放在ALT+TAB能进行切换的第一个和第二个位置，记得改两个号的“一号位置”的技能",
            "进行同行赠送：给小号发果实（记得筛选“非”了不起的天分）",
            "乘骑4号位后爱分享队伍：字面意思，队伍一4号位是我的同乘奇丽草，队伍三是我的爱分享队伍",
            "进行1键的精灵视野后切2键：队伍三爱分享队伍1号位是“嗜光嗡嗡”爱分享，2--6是任意爱分享",
            "挖矿切换开关：配合9一起使用，记得同开同关（默认按键为：ALT+`）",
            "挖矿切换2-6键：检测8是否开启，8开启后9才能用，“左键松开”后自动切换下一个精灵",
          ],
          file: "../../游戏宏/洛克王国世界/自用宏/洛克王国世界.rmt",
          images: [
            { name: "tip1", src: "../../游戏宏/洛克王国世界/自用宏/zsz.png" },
          ]
        },
        // 可以继续添加更多条目
      ];

      // 渲染左侧列表
      datas.forEach((item, index) => {
        const btn = document.createElement("div");
        btn.className = "info-button" + (index === 0 ? " active" : "");
        btn.textContent = item.title;
        btn.dataset.id = item.id;
        infoList.appendChild(btn);
      });

      // 默认显示第一个条目
      renderInfo(datas[0]);

      // 点击切换条目
      infoList.addEventListener("click", (e) => {
        const target = e.target.closest(".info-button");
        if (!target) return;

        document.querySelectorAll(".info-button").forEach(b => b.classList.remove("active"));
        target.classList.add("active");

        const data = datas.find(c => c.id === target.dataset.id);
        renderInfo(data);
      });

      document.body.addEventListener("click", e => {
        const img = e.target.closest(".image-item img");
        if (!img) return;

        const overlay = Object.assign(document.createElement("div"), {
          className: "img-overlay",
          innerHTML: `<img src="${img.src}" alt="">`
        });

        document.body.appendChild(overlay);
        overlay.addEventListener("click", () => overlay.remove());
      });

      function renderInfo(data) {
        let imagesHTML = "";
        if (data.images && data.images.length > 0) {
          imagesHTML = `<div class="images">
                ${data.images.map(img => `
                    <div class="image-item">
                        <p>${img.name}</p>
                        <img src="${img.src}" alt="${img.name}" />
                    </div>
                `).join("")}
            </div>`;
        }

        infoDetail.innerHTML = `
            <h2>${data.title}</h2>
            <div class="info">
                <p><strong>作者：</strong>${data.author}</p>
                <p><strong>功能描述：</strong>${data.feature}</p>
            </div>
            <div class="steps">
                <p><strong>操作步骤：</strong></p>
                <ol>${data.steps.map(s => `<li>${s}</li>`).join("")}</ol>
            </div>
            ${imagesHTML}
            <a class="download-btn" href="${data.file}" download>⬇下载配置</a>
        `;
      }
    });
  </script>
</body>

</html>
