<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>洛克王国世界</title>
  <link rel="icon" href="../../Images/Icon.png" />
  <link rel="stylesheet" href="../../CSS/Info.css" />
</head>

<body>
  <header>
    <h1>洛克王国世界</h1>
  </header>

  <main class="info-container">
    <!-- 左侧列表 -->
    <div id="infoList" class="info-list"></div>

    <!-- 右侧详细信息 -->
    <div id="infoDetail" class="info-detail">
      <p class="placeholder">点击左侧条目查看详细内容</p>
    </div>
  </main>

  <script>document.addEventListener("DOMContentLoaded", () => {
      const infoList = document.getElementById("infoList");
      const infoDetail = document.getElementById("infoDetail");

      const datas = [
        {
          id: "快捷键-自动剧情-操作简化",
          title: "快捷键-自动剧情-操作简化",
          author: "Nimoll",
          feature: "为游戏洛克王国世界添加没有的快捷按键，鼠标滚轮选择宠物，ad按键切换队伍，空格确定传送，自动过剧情，迪莫和燃薪虫自动放技能，持续扔咕噜球，自动脱离战斗，局内持续扔普通球直至捕捉，开背包里的技能配方",
          steps: [
            "适配2.5k，即2560*1600分辨率",
            "切换队伍功能需要在按p后出现的小队页面使用，需要把识别的文字改为你的小队名字的第一个字，默认为大世界小队中的”大“字",
            "按下右alt可在菜单宏（需先点两下b开关背包给鼠标复位避免误触）开启自动过剧情功能和放技能功能",
            "支持迪莫和燃薪虫重复点燃和充分燃烧，其他角色优先释放克制技能，若无则释放一号技能",
            "持续扔咕噜球为在选择咕噜球时连续点击鼠标左键，开技能石需要在背包-重要页面启动，解锁背包里所有技能后自动停止",
            "抓异色功能会在触发非污染精灵战斗时避战，在触发异色精灵战斗时将其打至眩晕状态"

          ],
          file: "../../游戏宏/洛克王国世界/快捷键-自动剧情-操作简化/洛克王国世界.rmt",
        },
        {
          id: "挂机刷花",
          title: "挂机刷花",
          author: "rubi",
          feature: "洛克王国简单挂机刷花",
          steps: [
            "需电脑多开洛克王国世界游戏窗口。",
            "并在做动作的账号游戏窗口内，按tab按键打开人物动作UI",
            "以管理员身份启动若梦兔程序，加载配置包",
            "加载完配置后，点击（2.）的游戏窗口。按ctrl+shitf+\ 组合按键启动。?首次启动声音响起证明启动成功",
          ],
          file: "../../游戏宏/洛克王国世界/挂机刷花/后台挂机刷花.rmt",
        },
        // 可以继续添加更多条目
      ];

      // 渲染左侧列表
      datas.forEach((item, index) => {
        const btn = document.createElement("div");
        btn.className = "info-button" + (index === 0 ? " active" : "");
        btn.textContent = item.title;
        btn.dataset.id = item.id;
        infoList.appendChild(btn);
      });

      // 默认显示第一个条目
      renderInfo(datas[0]);

      // 点击切换条目
      infoList.addEventListener("click", (e) => {
        const target = e.target.closest(".info-button");
        if (!target) return;

        document.querySelectorAll(".info-button").forEach(b => b.classList.remove("active"));
        target.classList.add("active");

        const data = datas.find(c => c.id === target.dataset.id);
        renderInfo(data);
      });

      document.body.addEventListener("click", e => {
        const img = e.target.closest(".image-item img");
        if (!img) return;

        const overlay = Object.assign(document.createElement("div"), {
          className: "img-overlay",
          innerHTML: `<img src="${img.src}" alt="">`
        });

        document.body.appendChild(overlay);
        overlay.addEventListener("click", () => overlay.remove());
      });

      function renderInfo(data) {
        let imagesHTML = "";
        if (data.images && data.images.length > 0) {
          imagesHTML = `<div class="images">
                ${data.images.map(img => `
                    <div class="image-item">
                        <p>${img.name}</p>
                        <img src="${img.src}" alt="${img.name}" />
                    </div>
                `).join("")}
            </div>`;
        }

        infoDetail.innerHTML = `
            <h2>${data.title}</h2>
            <div class="info">
                <p><strong>作者：</strong>${data.author}</p>
                <p><strong>功能描述：</strong>${data.feature}</p>
            </div>
            <div class="steps">
                <p><strong>操作步骤：</strong></p>
                <ol>${data.steps.map(s => `<li>${s}</li>`).join("")}</ol>
            </div>
            ${imagesHTML}
            <a class="download-btn" href="${data.file}" download>⬇下载配置</a>
        `;
      }
    });
  </script>
</body>

</html>
